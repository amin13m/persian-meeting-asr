# ============================================================
# Persian ASR - Main Configuration
# ============================================================

project:
  name: persian_asr
  mode: offline


# ============================================================
# Engine
# ============================================================

engine:
  name: whisper_persian_v4


# ============================================================
# Model
# ============================================================

model:
  path: models/whisper_persian_v4


# ============================================================
# Audio
# ============================================================

audio:
  input_dir: input
  output_dir: output

  sample_rate: 16000
  language: fa
  task: transcribe

  extensions:
    - .wav
    - .mp3
    - .flac
    - .m4a
    - .ogg


# ============================================================
# Chunking
# ============================================================

chunking:

  # Enable automatic long-audio chunking
  enabled: true

  # Maximum duration of each chunk
  # Whisper can process longer audio, but keeping chunks
  # bounded improves stability and memory usage.
  max_chunk_seconds: 30

  # Minimum useful speech segment
  min_chunk_seconds: 0.5

  # Silence detection threshold.
  #
  # Lower value = more sensitive to quiet speech.
  # Higher value = requires louder speech.
  #
  # librosa.effects.split uses top_db relative to signal level.
  silence_top_db: 30

  # Minimum silence duration required to create
  # a meaningful boundary.
  min_silence_seconds: 0.35

  # Extra audio before each detected speech region.
  # Helps prevent cutting the beginning of words.
  padding_before_seconds: 0.20

  # Extra audio after each detected speech region.
  padding_after_seconds: 0.20

  # If a continuous speech region is longer than
  # max_chunk_seconds, split it at the best available
  # internal boundary.
  fallback_split_seconds: 30


# ============================================================
# Output
# ============================================================

output:
  save_txt: true
  save_json: true

  # Save chunk-level information in JSON
  save_chunks: true


# ============================================================
# Device
# ============================================================

device:
  type: cuda
  dtype: float16


# ============================================================
# Logging
# ============================================================

logging:
  level: INFO