# ============================================================
# Persian ASR - Main Configuration
# ============================================================

project:
  name: persian_asr
  mode: offline

# ============================================================
# Main ASR Engine
# ============================================================

engine:
  name: whisper_persian_v4

model:
  path: models/whisper_persian_v4

# ============================================================
# Diarization
# ============================================================

diarization:
  enabled: true

  engine: pyannote

  # Local offline model
  model_path: models/diarization/speaker-diarization-community-1

  sample_rate: 16000

  device: cuda

  # اگر null باشند، مدل خودش تعداد گوینده‌ها را تخمین می‌زند.
  min_speakers: 3
  max_speakers: 5

  # خروجی‌ها
  save_rttm: true
  save_json: true
  save_turns: true

  # برای merge بهتر با ASR
  use_exclusive: true

# ============================================================
# Audio
# ============================================================

audio:
  input_dir: input
  output_dir: output

  sample_rate: 16000
  channels: 1

  language: fa
  task: transcribe

  extensions:
    - .wav
    - .mp3
    - .flac
    - .m4a
    - .ogg

# ============================================================
# Audio Preprocessing
# ============================================================

preprocessing:
  enabled: true

  # تبدیل همه ورودی‌ها به 16 kHz
  resample:
    enabled: true
    sample_rate: 16000

  # تبدیل به mono
  mono:
    enabled: true

  # فعلاً خاموش.
  # بعد از تست ASR و diarization، enhancement را جداگانه اضافه می‌کنیم.
  enhancement:
    enabled: false

    engine: null

    denoise: false
    dereverb: false
    normalization: false

# ============================================================
# Whisper Chunking
# ============================================================

chunking:
  enabled: true

  max_chunk_seconds: 30
  min_chunk_seconds: 0.5

  # تشخیص سکوت
  silence_top_db: 30
  min_silence_seconds: 0.35

  # کمی context اطراف هر chunk
  padding_before_seconds: 0.20
  padding_after_seconds: 0.20

  # اگر split بر اساس silence جواب نداد
  fallback_split_seconds: 30

# ============================================================
# Output
# ============================================================

output:
  save_txt: true
  save_json: true

  save_chunks: true

  # خروجی speaker turns
  save_speaker_turns: true

  # استاندارد diarization
  save_rttm: true

# ============================================================
# Compute
# ============================================================

device:
  type: cuda
  dtype: float16

# ============================================================
# Logging
# ============================================================

logging:
  level: INFO